wer));$('#exportCsv').onclick=()=>toast(`正在导出 ${drawerData().length} 条 Query`);$('#connect').onclick=()=>toast('打开 Google Search Console 授权');$('#stateAction').onclick=()=>toast('打开数据同步记录');$('#trend').onmousemove=e=>{if(!chartPoints.length)return;let r=e.target.getBoundingClientRect(),mx=e.clientX-r.left,idx=chartPoints.reduce((a,b)=>Math.abs(b.x-mx)<Math.abs(a.x-mx)?b:a).i,ms=chartPoints.filter(x=>x.i===idx);$('#trendTip').innerHTML=`<b>${pointLabel(idx)}</b><br>${ms.map(x=>`<span style="color:${series[x.k].color}">●</span> ${series[x.k].label}：${Math.round(x.v).toLocaleString()}`).join('<br>')}`;$('#trendTip').style.left=Math.min(r.width-165,Math.max(6,mx+10))+'px';$('#trendTip').style.top='38px';$('#trendTip').classList.add('show')};$('#trend').onmouseleave=()=>$('#trendTip').classList.remove('show');$('#bubble').onmousemove=e=>{let r=e.target.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,b=bubblePoints.find(p=>Math.hypot(p.x-mx,p.y-my)<=p.r+3);if(!b)return $('#bubbleTip').classList.remove('show');$('#bubbleTip').innerHTML=`<b>${b.q.q}</b><br>曝光 ${fmt(b.q.impressions)} · CTR ${pct(b.q.ctr)} · 排名 ${b.q.position}`;$('#bubbleTip').style.left=Math.min(r.width-190,Math.max(4,mx+9))+'px';$('#bubbleTip').style.top=Math.max(4,my-42)+'px';$('#bubbleTip').classList.add('show')};$('#bubble').onclick=e=>{let r=e.target.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,b=bubblePoints.find(p=>Math.hypot(p.x-mx,p.y-my)<=p.r+3);if(b)showQueryDetail(b.q)};window.onresize=()=>{drawTrend();drawBubble()};
    const params=new URLSearchParams(location.search);range=params.get('range')||'28d';$$('.range').forEach(x=>x.classList.toggle('active',x.dataset.range===range));view=params.get('view')==='pages'?'pages':'search';setView(view);applyState();updateMetrics();renderQueries();renderPages();window.addEventListener('wheel',e=>{if(window.parent===window||(!e.ctrlKey&&!e.metaKey))return;e.preventDefault();window.parent.postMessage({type:'prototype-canvas:frame-zoom',deltaY:e.deltaY,clientX:e.clientX,clientY:e.clientY},'*')},{passive:false});
  </script>
